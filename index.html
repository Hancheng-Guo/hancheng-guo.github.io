<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lain-Ego's Homepage</title>
  <meta name="description" content="Lain-Ego's robotics and intelligent systems portfolio.">
  <meta property="og:title" content="Lain-Ego's Portfolio">
  <meta property="og:description" content="Robotics, embedded systems and intelligent machines.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hancheng-guo.github.io/">
  <meta property="og:image" content="https://hancheng-guo.github.io/assets/images/Portfolio-01.png">
  <link rel="canonical" href="https://hancheng-guo.github.io/">
  <link rel="icon" href="assets/images/Avatar.jpg">
  
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav>
    <div class="container nav-container">
      <a href="#" class="logo">
        <span class="logo-text">Lain-Ego</span>
        <div class="logo-dot"></div>
      </a>
      
      <div class="nav-actions">
        <button class="control-btn menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation" data-i18n-aria-label="nav.openMenu">☰</button>
        <div class="nav-links" id="primary-navigation">
          <a href="#projects" data-i18n="nav.projects">Projects</a>
          <a href="#timeline" data-i18n="nav.timeline">Timeline</a>
          <a href="#skills" data-i18n="nav.skills">Stack</a>
          <a href="#contact" data-i18n="nav.contact">Contact</a>
        </div>
        
        <div class="nav-controls">
          <button class="control-btn lang-toggle" aria-label="Toggle language" data-i18n-aria-label="nav.toggleLanguage">中文</button>
          <button class="control-btn theme-toggle" aria-label="Toggle color theme" data-i18n-aria-label="nav.toggleTheme">
            <i class="fas fa-sun sun-icon"></i>
            <i class="fas fa-moon moon-icon"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <section class="intro">
    <div class="bg-decoration"></div>
    <div class="container flex-center column">
      <div class="avatar-container">
        <div class="avatar-glow"></div>
      </div>
      <h1 class="gradient-text" data-i18n="intro.title">Hello, I'm Lain-Ego</h1>
      <p class="subtitle" data-i18n="intro.desc">...</p>
      <div class="intro-actions">
        <a class="publish-link primary-action" href="#projects" data-i18n="intro.viewProjects">View Projects</a>
        <a class="publish-link" href="#contact" data-i18n="intro.contact">Contact Me</a>
      </div>
    </div>
  </section>

  <section id="projects" class="section-padding">
    <div class="container">
      <h2 data-i18n="projects.title">My Projects</h2>
      <div class="projects-grid"></div>
    </div>
  </section>

  <section id="timeline" class="section-padding">
    <div class="container">
      <h2 data-i18n="timeline.title">Timeline</h2>
      <div class="timeline-container"></div>
    </div>
  </section>

  <section id="skills" class="section-padding">
    <div class="container">
      <h2 data-i18n="skills.title">Tech Stack</h2>
      <div class="skills-wrapper"></div>
    </div>
  </section>

  <section id="contact" class="contact section-padding">
    <div class="container">
      <h2 data-i18n="contact.title">Let's Connect</h2> 
      <div class="contact-links"></div>
    </div>
  </section>

  <footer data-i18n="footer.copyright">© 2025 Lain-Ego. All rights reserved.</footer>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
